name: CRM CI

on:
  push:
    branches: [crm-v1]
    paths:
      - "crm/**"
      - ".github/workflows/crm-ci.yml"
  pull_request:
    paths:
      - "crm/**"
      - ".github/workflows/crm-ci.yml"

concurrency:
  group: crm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crm/backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crm/frontend/package.json
      - run: npm install
      - run: npm run build
