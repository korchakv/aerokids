name: CRM CI

on:
  push:
    branches: [crm-v1]
    paths:
      - "crm/**"
      - "neon.ts"
      - "package.json"
      - ".gitignore"
      - ".python-version"
      - "render.yaml"
      - ".github/workflows/crm-ci.yml"
      - ".github/dependabot.yml"
      - ".github/CODEOWNERS"
  pull_request:
    paths:
      - "crm/**"
      - "neon.ts"
      - "package.json"
      - ".gitignore"
      - ".python-version"
      - "render.yaml"
      - ".github/workflows/crm-ci.yml"
      - ".github/dependabot.yml"
      - ".github/CODEOWNERS"

permissions:
  contents: read

concurrency:
  group: crm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm/backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify production Python runtime lock
        working-directory: .
        run: test "$(cat .python-version)" = "3.12.11"
      - name: Validate operations shell scripts
        working-directory: .
        run: bash -n crm/scripts/backup-postgres.sh crm/scripts/restore-drill.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crm/backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile backend modules
        run: python -m compileall -q app
      - run: pytest -q
      - name: Verify Alembic migrations
        env:
          DATABASE_URL: sqlite:///./migration-ci.db
        run: alembic upgrade head
      - name: Verify invariant auditor on migrated database
        env:
          DATABASE_URL: sqlite:///./migration-ci.db
        run: python -m app.jobs.audit_invariants

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crm/frontend/package.json
      - run: npm install
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate compose
        working-directory: crm
        run: docker compose config
      - name: Build backend image
        run: docker build -t schoolcrm-api-ci crm/backend
      - name: Build frontend image
        run: docker build --build-arg VITE_API_URL=http://localhost:8000 -t schoolcrm-web-ci crm/frontend

  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: schoolcrm_ci
          POSTGRES_USER: schoolcrm
          POSTGRES_PASSWORD: schoolcrm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schoolcrm -d schoolcrm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: crm/backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://schoolcrm:schoolcrm@localhost:5432/schoolcrm_ci
      DATABASE_URL: postgresql+psycopg://schoolcrm:schoolcrm@localhost:5432/schoolcrm_ci
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crm/backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run full test suite on PostgreSQL
        run: pytest -q
      - name: Verify PostgreSQL migrations from empty schema
        run: |
          python - <<'PY'
          from app.db.base import Base
          from app.db.session import engine
          Base.metadata.drop_all(bind=engine)
          PY
          alembic upgrade head

      - name: Verify logical backup and restore into isolated PostgreSQL database
        env:
          DATABASE_URL_UNPOOLED: postgresql://schoolcrm:schoolcrm@localhost:5432/schoolcrm_ci
          RESTORE_DATABASE_URL: postgresql://schoolcrm:schoolcrm@localhost:5432/schoolcrm_restore_ci
          BACKUP_DIR: ${{ runner.temp }}/crm-restore-drill
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-16
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          python - <<'PY'
          import os
          import psycopg
          with psycopg.connect(os.environ["DATABASE_URL_UNPOOLED"], autocommit=True) as db:
              db.execute('CREATE DATABASE schoolcrm_restore_ci')
              db.execute('CREATE TABLE restore_drill_sentinel (value text NOT NULL)')
              db.execute("INSERT INTO restore_drill_sentinel VALUES ('restored row')")
          PY
          bash ../scripts/backup-postgres.sh
          bash ../scripts/restore-drill.sh "$BACKUP_DIR"/*.dump
          python - <<'PY'
          import os
          import psycopg
          with psycopg.connect(os.environ["RESTORE_DATABASE_URL"]) as db:
              assert db.execute('SELECT value FROM restore_drill_sentinel').fetchall() == [('restored row',)]
          PY

  full-stack-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and start full CRM stack
        working-directory: crm
        run: docker compose up -d --build
      - name: Run API end-to-end smoke flow
        run: python crm/scripts/smoke.py
      - name: Audit live smoke database invariants
        working-directory: crm
        run: docker compose exec -T api python -m app.jobs.audit_invariants
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crm/frontend/package.json
      - name: Install browser test dependencies
        working-directory: crm/frontend
        run: |
          npm install
          npx playwright install chromium webkit
      - name: Run desktop and mobile browser smoke tests
        working-directory: crm/frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
        run: npm run test:e2e
      - name: Show stack logs on failure
        if: failure()
        working-directory: crm
        run: docker compose logs --no-color
      - name: Stop full CRM stack
        if: always()
        working-directory: crm
        run: docker compose down -v

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crm/backend/requirements.txt
      - name: Audit Python dependencies
        working-directory: crm/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pip-audit bandit
          pip-audit
          bandit -q -r app -lll

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crm/frontend/package.json
      - name: Audit frontend dependencies
        working-directory: crm/frontend
        run: |
          npm install
          npm audit --audit-level=high

  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan git history for leaked secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
