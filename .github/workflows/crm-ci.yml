name: CRM CI

on:
  push:
    branches: [crm-v1]
    paths:
      - "crm/**"
      - "neon.ts"
      - "package.json"
      - ".gitignore"
      - ".github/workflows/crm-ci.yml"
  pull_request:
    paths:
      - "crm/**"
      - "neon.ts"
      - "package.json"
      - ".gitignore"
      - ".github/workflows/crm-ci.yml"

concurrency:
  group: crm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crm/backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Verify Alembic migrations
        env:
          DATABASE_URL: sqlite:///./migration-ci.db
        run: alembic upgrade head

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crm/frontend/package.json
      - run: npm install
      - run: npm run build


  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        working-directory: crm
        run: docker compose config
      - name: Build backend image
        run: docker build -t schoolcrm-api-ci crm/backend
      - name: Build frontend image
        run: docker build --build-arg VITE_API_URL=http://localhost:8000 -t schoolcrm-web-ci crm/frontend


  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: schoolcrm_ci
          POSTGRES_USER: schoolcrm
          POSTGRES_PASSWORD: schoolcrm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schoolcrm -d schoolcrm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: crm/backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://schoolcrm:schoolcrm@localhost:5432/schoolcrm_ci
      DATABASE_URL: postgresql+psycopg://schoolcrm:schoolcrm@localhost:5432/schoolcrm_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crm/backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run full test suite on PostgreSQL
        run: pytest -q
      - name: Verify PostgreSQL migrations from empty schema
        run: |
          python - <<'PY'
          from app.db.base import Base
          from app.db.session import engine
          Base.metadata.drop_all(bind=engine)
          PY
          alembic upgrade head

      - name: Verify database migration copy and fingerprinting
        env:
          PGPASSWORD: schoolcrm
        run: |
          psql -h localhost -U schoolcrm -d postgres -c "CREATE DATABASE migration_source;"
          psql -h localhost -U schoolcrm -d postgres -c "CREATE DATABASE migration_target;"

          DATABASE_URL=postgresql+psycopg://schoolcrm:schoolcrm@localhost:5432/migration_source alembic upgrade head

          DATABASE_URL=postgresql+psycopg://schoolcrm:schoolcrm@localhost:5432/migration_source python - <<'PY'
          from datetime import time
          from sqlalchemy.orm import Session

          from app.db.session import engine
          from app.models.core import (
              AvailabilityPreference,
              Contact,
              Location,
              Organization,
              Student,
              StudentAvailability,
              StudentContact,
          )

          with Session(engine) as db:
              org = Organization(name="Migration Test", slug="migration-test")
              db.add(org)
              db.flush()

              location = Location(
                  organization_id=org.id,
                  name="Frankfurt Test",
                  address="Test address",
              )
              contact = Contact(
                  organization_id=org.id,
                  full_name="Parent Test",
                  phone="+380931234567",
                  email="parent@example.com",
              )
              student = Student(
                  organization_id=org.id,
                  first_name="Child",
                  last_name="Test",
                  age_at_inquiry=10,
                  source="ci",
              )
              db.add_all([location, contact, student])
              db.flush()

              student.preferred_location_id = location.id
              db.add(StudentContact(
                  organization_id=org.id,
                  student_id=student.id,
                  contact_id=contact.id,
                  relation="parent",
                  is_primary=True,
              ))
              db.add(StudentAvailability(
                  organization_id=org.id,
                  student_id=student.id,
                  weekday=1,
                  start_time=time(17, 0),
                  end_time=time(18, 0),
                  preference=AvailabilityPreference.PREFERRED,
                  note="CI migration",
              ))
              db.commit()
          PY

          python - <<'PY'
          from app.db.migrate_database import migrate_database

          source = "postgresql+psycopg://schoolcrm:schoolcrm@localhost:5432/migration_source"
          target = "postgresql+psycopg://schoolcrm:schoolcrm@localhost:5432/migration_target"

          first = migrate_database(source, target)
          assert sum(item["rows"] for item in first.values()) >= 6
          assert all(item["status"] == "verified" for item in first.values())

          second = migrate_database(source, target)
          assert all(item["status"] == "already-identical" for item in second.values())
          PY


  full-stack-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start full CRM stack
        working-directory: crm
        run: docker compose up -d --build
      - name: Run end-to-end smoke flow
        run: python crm/scripts/smoke.py
      - name: Show stack logs on failure
        if: failure()
        working-directory: crm
        run: docker compose logs --no-color
      - name: Stop full CRM stack
        if: always()
        working-directory: crm
        run: docker compose down -v


  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crm/backend/requirements.txt
      - name: Audit Python dependencies
        working-directory: crm/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pip-audit bandit
          pip-audit
          bandit -q -r app -lll

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crm/frontend/package.json
      - name: Audit frontend dependencies
        working-directory: crm/frontend
        run: |
          npm install
          npm audit --audit-level=high
