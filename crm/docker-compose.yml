services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: schoolcrm
      POSTGRES_USER: schoolcrm
      POSTGRES_PASSWORD: schoolcrm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolcrm -d schoolcrm"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - crm_pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://schoolcrm:schoolcrm@db:5432/schoolcrm
      ENVIRONMENT: production
      AUTH_REQUIRED: "true"
      JWT_SECRET: local-dev-secret-change-before-public-deploy
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 6
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    environment:
      API_HOST: api
      API_PORT: "8000"
      PORT: "80"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  crm_pgdata:
